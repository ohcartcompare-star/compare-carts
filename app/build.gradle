plugins {
    id 'com.android.application'
}
android {
    namespace 'com.cartcompare.personal'
    compileSdk 35
    defaultConfig {
        applicationId "com.cartcompare.personal"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0-personal"
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release { minifyEnabled false }
    }
}
